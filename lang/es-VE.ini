STR_EULA_TITLE=Acuerdo de Licencia de Usuario Final
STR_EULA_BODY=SmartClip Acuerdo de Licencia de Usuario Final\r\n\r\n1. Concesión de licencia\r\nEste software te otorga una licencia no exclusiva e intransferible para usar este software de acuerdo con la documentación.\r\n\r\n2. Restricciones de uso\r\nNo puedes descompilar, desensamblar ni aplicar ingeniería inversa a este software; no puedes usar este software para ningún fin ilegal.\r\n\r\n3. Propiedad intelectual\r\nTodos los derechos de propiedad intelectual de este software y sus copias pertenecen al desarrollador. Esta licencia no te otorga el derecho a usar las marcas comerciales o logotipos asociados con este software.\r\n\r\n4. Exención de responsabilidad\r\nEste software se proporciona "tal cual" sin garantía de ningún tipo. El desarrollador no es responsable de ninguna pérdida causada por el uso de este software.\r\nEste software utiliza una base de datos SQLite3 para almacenar registros, pero la base de datos no está cifrada. El contenido registrado puede ser obtenido y visto ilegalmente. Por favor, mantén seguros los archivos del directorio de datos (se pueden ver en Configuración - Datos).\r\n\r\n5. Terminación\r\nSi violas cualquier término de este acuerdo de licencia, la licencia se terminará automáticamente y deberás dejar de usar y destruir todas las copias de este software de inmediato.\r\n\r\nInstalar y usar este software constituye la aceptación del acuerdo anterior.
STR_PRIVACY_TITLE=Política de Privacidad
STR_PRIVACY_BODY=SmartClip Política de Privacidad\r\n\r\n1. Almacenamiento de datos\r\nTu historial del portapapeles se almacena solo en tu computadora local y no se sube a ningún servidor.\r\n\r\n2. Recopilación de datos\r\nEste software no recopila tu información personal. El contenido del portapapeles solo se pega o comparte cuando lo usas activamente.\r\n\r\n3. Servicios de terceros\r\nEste software no utiliza servicios de análisis de terceros ni SDK de anuncios.\r\n\r\n4. Seguridad de los datos\r\nRecomendamos que limpies regularmente el historial del portapapeles que ya no necesites para proteger la información sensible.\r\n\r\n5. Actualizaciones de la política de privacidad\r\nPodemos actualizar esta política de privacidad de vez en cuando. La política actualizada se mostrará en el software.\r\n\r\nInstalar y usar este software constituye la aceptación de la política de privacidad anterior.
