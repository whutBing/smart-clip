STR_EULA_BODY=SmartClip End User License Agreement\r\n\r\n1. Grant of License\r\nThis software grants you a non-exclusive, non-transferable license to use this software in accordance with the documentation.\r\n\r\n2. Use Restrictions\r\nYou may not decompile, disassemble, or otherwise reverse engineer this software; you may not use this software for any illegal purpose.\r\n\r\n3. Intellectual Property\r\nAll intellectual property rights in this software and its copies belong to the developer. This license does not grant you the right to use the trademarks or logos associated with this software.\r\n\r\n4. Disclaimer\r\nThis software is provided "as is" without any warranty of any kind. The developer is not liable for any losses caused by the use of this software.\r\nThis software uses a SQLite3 database to store records, but the database is not encrypted. Recorded content may be illegally obtained and viewed. Please keep the data directory files safe (can be viewed under Settings - Data).\r\n\r\n5. Termination\r\nIf you violate any term of this license agreement, the license will automatically terminate and you must immediately stop using and destroy all copies of this software.\r\n\r\nInstalling and using this software constitutes acceptance of the above agreement.
STR_PRIVACY_TITLE=Privacy Policy
STR_PRIVACY_BODY=SmartClip Privacy Policy\r\n\r\n1. Data Storage\r\nYour clipboard history is stored only on your local computer and is not uploaded to any server.\r\n\r\n2. Data Collection\r\nThis software does not collect your personal information. Clipboard content is only pasted or shared when you actively use it.\r\n\r\n3. Third-Party Services\r\nThis software does not use any third-party analytics services or ad SDKs.\r\n\r\n4. Data Security\r\nWe recommend that you regularly clean up clipboard history you no longer need to protect sensitive information.\r\n\r\n5. Privacy Policy Updates\r\nWe may update this privacy policy from time to time. The updated policy will be displayed in the software.\r\n\r\nInstalling and using this software constitutes acceptance of the above privacy policy.
