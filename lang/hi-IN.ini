STR_AGREEMENT_DIALOG_BODY=यह सॉफ़्टवेयर केवल कानूनी उद्देश्यों के लिए है। उपयोगकर्ताओं को अपने क्लिपबोर्ड डेटा की उचित रूप से रक्षा करनी चाहिए।\r\nक्लिपबोर्ड सामग्री में संवेदनशील जानकारी हो सकती है। सिस्टम विफलताएँ, आकस्मिक ऑपरेशन या अप्रत्याशित समस्याएँ डेटा हानि का कारण बन सकती हैं। परिणामी क्षति के लिए लेखक उत्तरदायी नहीं है।\r\n"स्वीकार करें" पर क्लिक करने का अर्थ है कि आपने उपरोक्त शर्तों को पढ़ और स्वीकार कर लिया है।
