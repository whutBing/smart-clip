STR_AGREEMENT_DIALOG_BODY=Bu yazılım yalnızca yasal amaçlar için kullanılabilir. Kullanıcılar pano verilerini düzgün şekilde korumalıdır.\r\nPano içeriği hassas bilgiler içerebilir. Sistem arızaları, yanlış işlemler veya beklenmeyen sorunlar veri kaybına neden olabilir. Geliştirici ortaya çıkan zararlardan sorumlu değildir.\r\n"Kabul" et tıklayarak yukarıdaki şartları okuyup kabul etmiş sayılırsınız.
