STR_EULA_TITLE=ข้อตกลงสิทธิ์การใช้งานสำหรับผู้ใช้ปลายทาง
STR_EULA_BODY=SmartClip ข้อตกลงสิทธิ์การใช้งานสำหรับผู้ใช้ปลายทาง\r\n\r\n1. การอนุญาตสิทธิ์\r\nซอฟต์แวร์นี้ให้สิทธิ์การใช้งานแบบไม่ผูกขาดและไม่สามารถโอนต่อได้แก่คุณ ในการใช้งานซอฟต์แวร์นี้ตามเอกสารประกอบ\r\n\r\n2. ข้อจำกัดการใช้งาน\r\nคุณต้องไม่ดีคอมไพล์ แยกชิ้นส่วน หรือวิศวกรรมย้อนกลับซอฟต์แวร์นี้ และต้องไม่ใช้ซอฟต์แวร์นี้เพื่อวัตถุประสงค์ที่ผิดกฎหมาย\r\n\r\n3. ทรัพย์สินทางปัญญา\r\nสิทธิ์ในทรัพย์สินทางปัญญาทั้งหมดของซอฟต์แวร์นี้และสำเนาทั้งหมดเป็นของนักพัฒนา ข้อตกลงนี้ไม่ได้ให้สิทธิ์คุณในการใช้เครื่องหมายการค้าหรือโลโก้ที่เกี่ยวข้องกับซอฟต์แวร์นี้\r\n\r\n4. การปฏิเสธความรับผิด\r\nซอฟต์แวร์นี้ให้ใช้งาน "ตามสภาพ" โดยไม่มีการรับประกันใดๆ นักพัฒนาไม่รับผิดชอบต่อความเสียหายใดๆ ที่เกิดจากการใช้งานซอฟต์แวร์นี้\r\nซอฟต์แวร์นี้ใช้ฐานข้อมูล SQLite3 ในการจัดเก็บระเบียน แต่ฐานข้อมูลไม่ได้เข้ารหัส เนื้อหาที่บันทึกไว้อาจถูกเข้าถึงและดูได้โดยผิดกฎหมาย โปรดเก็บไฟล์ในโฟลเดอร์ข้อมูลให้ปลอดภัย (ดูได้ที่ การตั้งค่า - ข้อมูล)\r\n\r\n5. การสิ้นสุดข้อตกลง\r\nหากคุณละเมิดข้อกำหนดใดๆ ของข้อตกลงนี้ สิทธิ์การใช้งานจะสิ้นสุดลงโดยอัตโนมัติ และคุณต้องหยุดใช้งานและทำลายสำเนาทั้งหมดของซอฟต์แวร์นี้ทันที\r\n\r\nการติดตั้งและใช้งานซอฟต์แวร์นี้ถือเป็นการยอมรับข้อตกลงข้างต้น
STR_PRIVACY_TITLE=นโยบายความเป็นส่วนตัว
STR_PRIVACY_BODY=SmartClip นโยบายความเป็นส่วนตัว\r\n\r\n1. การจัดเก็บข้อมูล\r\nประวัติคลิปบอร์ดของคุณถูกจัดเก็บในคอมพิวเตอร์ของคุณเท่านั้น และไม่มีการอัปโหลดไปยังเซิร์ฟเวอร์ใดๆ\r\n\r\n2. การเก็บรวบรวมข้อมูล\r\nซอฟต์แวร์นี้ไม่เก็บรวบรวมข้อมูลส่วนบุคคลของคุณ เนื้อหาในคลิปบอร์ดจะถูกวางหรือแชร์เฉพาะเมื่อคุณใช้งานอย่างจริงจังเท่านั้น\r\n\r\n3. บริการของบุคคลที่สาม\r\nซอฟต์แวร์นี้ไม่ใช้บริการวิเคราะห์ข้อมูลหรือ SDK โฆษณาของบุคคลที่สามใดๆ\r\n\r\n4. ความปลอดภัยของข้อมูล\r\nเราขอแนะนำให้คุณทำความสะอาดประวัติคลิปบอร์ดที่ไม่จำเป็นอีกต่อไปเป็นประจำเพื่อปกป้องข้อมูลที่ละเอียดอ่อน\r\n\r\n5. การอัปเดตนโยบายความเป็นส่วนตัว\r\nเราอาจอัปเดตนโยบายความเป็นส่วนตัวนี้เป็นครั้งคราว นโยบายที่อัปเดตแล้วจะแสดงในซอฟต์แวร์\r\n\r\nการติดตั้งและใช้งานซอฟต์แวร์นี้ถือเป็นการยอมรับนโยบายความเป็นส่วนตัวข้างต้น
