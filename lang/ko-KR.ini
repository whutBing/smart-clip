STR_AGREEMENT_DIALOG_SUBTITLE=동의서를 읽고 동의한 후 사용을 시작하세요
STR_AGREEMENT_DIALOG_BODY=본 소프트웨어는 합법적인 용도로만 사용할 수 있습니다. 사용자는 클립보드 데이터를 적절히 보관해야 합니다.\r\n클립보드 내용에는 민감한 정보가 포함될 수 있습니다. 시스템 오류, 조작 실수 또는 예기치 않은 문제로 인해 데이터가 손실될 수 있으며, 개발자는 이로 인한 손해에 대해 책임지지 않습니다.\r\n"동의"를 클릭하면 위 약관을 읽고 동의한 것으로 간주됩니다.
