STR_EULA_BODY=SmartClip अंतिम उपयोगकर्ता लाइसेंस अनुबंध\r\n\r\n1. लाइसेंस की अनुदान\r\nयह सॉफ़्टवेयर आपको दस्तावेज़ीकरण के अनुसार इस सॉफ़्टवेयर का उपयोग करने के लिए एक गैर-अनन्य, गैर-हस्तांतरणीय लाइसेंस प्रदान करता है।\r\n\r\n2. उपयोग प्रतिबंध\r\nआप इस सॉफ़्टवेयर को डीकंपाइल, डिस्सेम्बल या अन्यथा रिवर्स इंजीनियर नहीं कर सकते; आप किसी भी अवैध उद्देश्य के लिए इस सॉफ़्टवेयर का उपयोग नहीं कर सकते।\r\n\r\n3. बौद्धिक संपदा\r\nइस सॉफ़्टवेयर और इसकी प्रतियों के सभी बौद्धिक संपदा अधिकार डेवलपर के हैं। यह लाइसेंस आपको इस सॉफ़्टवेयर से जुड़े ट्रेडमार्क या लोगो का उपयोग करने का अधिकार नहीं देता है।\r\n\r\n4. अस्वीकरण\r\nयह सॉफ़्टवेयर "जैसा है वैसा" प्रदान किया जाता है, बिना किसी प्रकार की किसी वारंटी के। इस सॉफ़्टवेयर के उपयोग से होने वाली किसी भी हानि के लिए डेवलपर उत्तरदायी नहीं है।\r\nयह सॉफ़्टवेयर रिकॉर्ड संग्रहीत करने के लिए SQLite3 डेटाबेस का उपयोग करता है, लेकिन डेटाबेस एन्क्रिप्टेड नहीं है। दर्ज की गई सामग्री अवैध रूप से प्राप्त और देखी जा सकती है। कृपया डेटा निर्देशिका फ़ाइलों को सुरक्षित रखें (सेटिंग्स - डेटा के अंतर्गत देखा जा सकता है)।\r\n\r\n5. समाप्ति\r\nयदि आप इस लाइसेंस अनुबंध की किसी भी शर्त का उल्लंघन करते हैं, तो लाइसेंस स्वतः समाप्त हो जाएगा और आपको तुरंत इस सॉफ़्टवेयर का उपयोग बंद करना होगा और इसकी सभी प्रतियां नष्ट करनी होंगी।\r\n\r\nइस सॉफ़्टवेयर को इंस्टॉल करना और उपयोग करना उपरोक्त अनुबंध की स्वीकृति माना जाता है।
STR_PRIVACY_TITLE=गोपनीयता नीति
STR_PRIVACY_BODY=SmartClip गोपनीयता नीति\r\n\r\n1. डेटा भंडारण\r\nआपका क्लिपबोर्ड इतिहास केवल आपके स्थानीय कंप्यूटर पर संग्रहीत होता है और किसी भी सर्वर पर अपलोड नहीं किया जाता है।\r\n\r\n2. डेटा संग्रह\r\nयह सॉफ़्टवेयर आपकी व्यक्तिगत जानकारी एकत्र नहीं करता है। क्लिपबोर्ड सामग्री केवल तब पेस्ट या साझा की जाती है जब आप सक्रिय रूप से इसका उपयोग करते हैं।\r\n\r\n3. तृतीय-पक्ष सेवाएँ\r\nयह सॉफ़्टवेयर किसी भी तृतीय-पक्ष विश्लेषण सेवाओं या विज्ञापन SDK का उपयोग नहीं करता है।\r\n\r\n4. डेटा सुरक्षा\r\nहम अनुशंसा करते हैं कि आप संवेदनशील जानकारी की सुरक्षा के लिए नियमित रूप से उस क्लिपबोर्ड इतिहास को साफ़ करें जिसकी आपको अब आवश्यकता नहीं है।\r\n\r\n5. गोपनीयता नीति अपडेट\r\nहम समय-समय पर इस गोपनीयता नीति को अपडेट कर सकते हैं। अपडेट की गई नीति सॉफ़्टवेयर में प्रदर्शित की जाएगी।\r\n\r\nइस सॉफ़्टवेयर को इंस्टॉल करना और उपयोग करना उपरोक्त गोपनीयता नीति की स्वीकृति माना जाता है।
