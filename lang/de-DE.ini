STR_AGREEMENT_DIALOG_BODY=Diese Software darf nur für rechtmäßige Zwecke verwendet werden. Benutzer müssen ihre Zwischenablage-Daten ordnungsgemäß sichern.\r\nZwischenablage-Inhalte können sensible Informationen enthalten. Systemausfälle, Fehlbedienungen oder unerwartete Probleme können zu Datenverlust führen. Der Entwickler haftet nicht für entstehende Schäden.\r\nMit dem Klick auf "Akzeptieren" gelten Sie als gelesen und akzeptiert.
