STR_EULA_TITLE=Лицензионно споразумение с крайния потребител
STR_EULA_BODY=SmartClip Лицензионно споразумение с крайния потребител\r\n\r\n1. Предоставяне на лиценз\r\nТози софтуер ви предоставя неизключителен, непрехвърляем лиценз за използване на софтуера в съответствие с документацията.\r\n\r\n2. Ограничения за употреба\r\nНе можете да декомпилирате, дизасемблирате или по друг начин да извършвате обратен инженеринг на този софтуер; не можете да използвате този софтуер за никакви незаконни цели.\r\n\r\n3. Интелектуална собственост\r\nВсички права на интелектуална собственост върху този софтуер и неговите копия принадлежат на разработчика. Този лиценз не ви предоставя право да използвате търговските марки или лога, свързани с този софтуер.\r\n\r\n4. Отказ от отговорност\r\nТози софтуер се предоставя „както е“ без никакви гаранции от какъвто и да е вид. Разработчикът не носи отговорност за каквито и да е загуби, причинени от използването на този софтуер.\r\nТози софтуер използва база данни SQLite3 за съхраняване на записи, но базата данни не е криптирана. Записаното съдържание може да бъде незаконно получено и прегледано. Моля, пазете файловете в директорията с данни (може да се види в Настройки - Данни).\r\n\r\n5. Прекратяване\r\nАко нарушите който и да е член на това лицензионно споразумение, лицензът ще бъде автоматично прекратен и вие трябва незабавно да спрете да използвате и да унищожите всички копия на този софтуер.\r\n\r\nИнсталирането и използването на този софтуер означава приемане на горепосоченото споразумение.
STR_PRIVACY_TITLE=Политика за поверителност
STR_PRIVACY_BODY=SmartClip Политика за поверителност\r\n\r\n1. Съхранение на данни\r\nВашата история на клипборда се съхранява само на вашия локален компютър и не се качва на никакъв сървър.\r\n\r\n2. Събиране на данни\r\nТози софтуер не събира личната ви информация. Съдържанието на клипборда се поставя или споделя само когато вие активно го използвате.\r\n\r\n3. Услуги на трети страни\r\nТози софтуер не използва услуги за анализ на трети страни или рекламни SDK.\r\n\r\n4. Сигурност на данните\r\nПрепоръчваме ви редовно да почиствате историята на клипборда, която вече не ви е нужна, за да защитите чувствителната информация.\r\n\r\n5. Актуализации на политиката за поверителност\r\nМожем от време на време да актуализираме тази политика за поверителност. Актуализираната политика ще бъде показана в софтуера.\r\n\r\nИнсталирането и използването на този софтуер означава приемане на горепосочената политика за поверителност.
