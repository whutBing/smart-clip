STR_EULA_TITLE=エンドユーザーライセンス契約
STR_EULA_BODY=SmartClip エンドユーザーライセンス契約\r\n\r\n1. ライセンスの付与\r\n本ソフトウェアは、ドキュメントに従って本ソフトウェアを使用するための、非独占的かつ譲渡不能なライセンスを付与します。\r\n\r\n2. 使用制限\r\n本ソフトウェアを逆コンパイル、逆アセンブル、またはその他のリバースエンジニアリングを行ってはなりません。また、本ソフトウェアを違法な目的で使用してはなりません。\r\n\r\n3. 知的財産\r\n本ソフトウェアおよびその複製物に関するすべての知的財産権は開発者に帰属します。本ライセンスは、本ソフトウェアに関連する商標またはロゴを使用する権利を付与するものではありません。\r\n\r\n4. 免責事項\r\n本ソフトウェアは、いかなる種類の保証もなく「現状有姿」で提供されます。開発者は、本ソフトウェアの使用によって生じた損害について一切の責任を負いません。\r\n本ソフトウェアは SQLite3 データベースを使用して記録を保存しますが、暗号化されていません。記録内容が不正に取得されて閲覧される可能性があります。データディレクトリファイルを適切に保管してください（設定-データで確認できます）。\r\n\r\n5. 契約の終了\r\n本ライセンス契約のいずれかの条項に違反した場合、ライセンスは自動的に終了し、本ソフトウェアの使用を直ちに中止し、すべての複製物を破棄しなければなりません。\r\n\r\n本ソフトウェアをインストールして使用することで、上記の契約に同意したものとみなされます。
STR_PRIVACY_TITLE=プライバシーポリシー
STR_PRIVACY_BODY=SmartClip プライバシーポリシー\r\n\r\n1. データストレージ\r\nクリップボード履歴はお使いのローカルコンピュータにのみ保存され、サーバーにはアップロードされません。\r\n\r\n2. データ収集\r\n本ソフトウェアは個人情報を収集しません。クリップボードの内容は、アクティブに使用した場合にのみ貼り付けまたは共有されます。\r\n\r\n3. サードパーティサービス\r\n本ソフトウェアは、サードパーティの分析サービスや広告 SDK を使用しません。\r\n\r\n4. データセキュリティ\r\n機密情報を保護するため、不要になったクリップボード履歴を定期的にクリーンアップすることをお勧めします。\r\n\r\n5. プライバシーポリシーの更新\r\n当社は本プライバシーポリシーを随時更新する場合があります。更新されたポリシーはソフトウェアに表示されます。\r\n\r\n本ソフトウェアをインストールして使用することで、上記のプライバシーポリシーに同意したものとみなされます。
