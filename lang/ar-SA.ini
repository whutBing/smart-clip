STR_EULA_TITLE=اتفاقية ترخيص المستخدم النهائي
STR_EULA_BODY=اتفاقية ترخيص المستخدم النهائي لـ SmartClip\r\n\r\n1. منح الترخيص\r\nتمنحك هذه البرامج ترخيصًا غير حصري وغير قابل للتحويل لاستخدام هذه البرامج وفقًا للوثائق.\r\n\r\n2. قيود الاستخدام\r\nلا يجوز لك فك تجميع هذه البرامج أو تفكيكها أو الهندسة العكسية لها بأي طريقة أخرى؛ لا يجوز لك استخدام هذه البرامج لأي غرض غير قانوني.\r\n\r\n3. الملكية الفكرية\r\nتعود جميع حقوق الملكية الفكرية في هذه البرامج ونسخها إلى المطور. لا يمنحك هذا الترخيص الحق في استخدام العلامات التجارية أو الشعارات المرتبطة بهذه البرامج.\r\n\r\n4. إخلاء المسؤولية\r\nتُقدم هذه البرامج "كما هي" دون أي ضمان من أي نوع. المطور غير مسؤول عن أي خسائر ناتجة عن استخدام هذه البرامج.\r\nيستخدم هذا البرنامج قاعدة بيانات SQLite3 لتخزين السجلات، لكنها غير مشفرة. قد يتم الحصول على المحتوى المسجل وعرضه بشكل غير قانوني. يرجى الحفاظ على أمان ملفات دليل البيانات (يمكن عرضها تحت الإعدادات - البيانات).\r\n\r\n5. الإنهاء\r\nإذا انتهكت أي شرط في اتفاقية الترخيص هذه، فسينتهي الترخيص تلقائيًا ويجب عليك التوقف فورًا عن الاستخدام وإتلاف جميع نسخ هذه البرامج.\r\n\r\nيُعد تثبيت هذه البرامج واستخدامها قبولًا للاتفاقية المذكورة أعلاه.
STR_PRIVACY_TITLE=سياسة الخصوصية
STR_PRIVACY_BODY=سياسة خصوصية SmartClip\r\n\r\n1. تخزين البيانات\r\nيتم تخزين سجل الحافظة على جهاز الكمبيوتر المحلي الخاص بك فقط ولا يتم تحميله إلى أي خادم.\r\n\r\n2. جمع البيانات\r\nلا تقوم هذه البرامج بجمع معلوماتك الشخصية. لا يتم لصق محتوى الحافظة أو مشاركته إلا عندما تستخدمه بنشاط.\r\n\r\n3. خدمات الطرف الثالث\r\nلا تستخدم هذه البرامج أي خدمات تحليلية تابعة لجهات خارجية أو حزم تطوير برمجيات إعلانية.\r\n\r\n4. أمان البيانات\r\nنوصي بتنظيف سجل الحافظة الذي لم تعد بحاجة إليه بانتظام لحماية المعلومات الحساسة.\r\n\r\n5. تحديثات سياسة الخصوصية\r\nقد نقوم بتحديث سياسة الخصوصية هذه من وقت لآخر. سيتم عرض السياسة المحدثة في البرامج.\r\n\r\nيُعد تثبيت هذه البرامج واستخدامها قبولًا لسياسة الخصوصية المذكورة أعلاه.
