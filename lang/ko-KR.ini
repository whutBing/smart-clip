STR_EULA_BODY=SmartClip 최종 사용자 라이선스 계약\r\n\r\n1. 라이선스 부여\r\n본 소프트웨어는 문서에 따라 본 소프트웨어를 사용할 수 있는 비독점적이며 양도 불가능한 라이선스를 부여합니다.\r\n\r\n2. 사용 제한\r\n본 소프트웨어를 역컴파일, 역어셈블 또는 기타 리버스 엔지니어링해서는 안 됩니다. 또한 본 소프트웨어를 불법적인 목적으로 사용해서는 안 됩니다.\r\n\r\n3. 지적 재산\r\n본 소프트웨어 및 그 사본에 대한 모든 지적 재산권은 개발자에게 있습니다. 본 라이선스는 본 소프트웨어와 관련된 상표나 로고를 사용할 권리를 부여하지 않습니다.\r\n\r\n4. 면책 조항\r\n본 소프트웨어는 어떠한 종류의 보증도 없이 "있는 그대로" 제공됩니다. 개발자는 본 소프트웨어 사용으로 인해 발생한 손실에 대해 책임을 지지 않습니다.\r\n본 소프트웨어는 SQLite3 데이터베이스를 사용하여 기록을 저장하지만 암호화되지 않았습니다. 기록 내용이 불법적으로 획득되어 조회될 수 있습니다. 데이터 디렉토리 파일을 안전하게 보관하십시오 (설정-데이터에서 확인 가능).\r\n\r\n5. 계약 종료\r\n본 라이선스 계약의 조항을 위반할 경우, 라이선스는 자동으로 종료되며 본 소프트웨어 사용을 즉시 중단하고 모든 사본을 파기해야 합니다.\r\n\r\n본 소프트웨어를 설치하고 사용하면 위 계약에 동의하는 것으로 간주됩니다.
STR_PRIVACY_TITLE=개인정보 처리방침
STR_PRIVACY_BODY=SmartClip 개인정보 처리방침\r\n\r\n1. 데이터 저장\r\n클립보드 기록은 로컬 컴퓨터에만 저장되며 서버로 업로드되지 않습니다.\r\n\r\n2. 데이터 수집\r\n본 소프트웨어는 개인정보를 수집하지 않습니다. 클립보드 내용은 활발히 사용할 때만 붙여넣기 또는 공유됩니다.\r\n\r\n3. 타사 서비스\r\n본 소프트웨어는 타사 분석 서비스나 광고 SDK를 사용하지 않습니다.\r\n\r\n4. 데이터 보안\r\n민감한 정보를 보호하기 위해 더 이상 필요 없는 클립보드 기록을 정기적으로 정리할 것을 권장합니다.\r\n\r\n5. 개인정보 처리방침 업데이트\r\n당사는 본 개인정보 처리방침을 수시로 업데이트할 수 있습니다. 업데이트된 정책은 소프트웨어에 표시됩니다.\r\n\r\n본 소프트웨어를 설치하고 사용하면 위 개인정보 처리방침에 동의하는 것으로 간주됩니다.
