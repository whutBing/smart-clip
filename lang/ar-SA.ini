STR_AGREEMENT_DIALOG_BODY=هذا البرنامج للاستخدامات المشروعة فقط. يجب على المستخدمين الحفاظ على بيانات الحافظة بشكل صحيح.\r\nقد تحتوي محتويات الحافظة على معلومات حساسة. قد تؤدي أعطال النظام أو الأخطاء التشغيلية أو المشاكل غير المتوقعة إلى فقدان البيانات، والمطور غير مسؤول عن أي أضرار ناتجة.\r\nبالنقر على "قبول" تعتبر قد قرأت ووافقت على الشروط أعلاه.
