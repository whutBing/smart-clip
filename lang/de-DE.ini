STR_EULA_TITLE=Endbenutzer-Lizenzvereinbarung
STR_EULA_BODY=SmartClip Endbenutzer-Lizenzvereinbarung\r\n\r\n1. Lizenzgewährung\r\nDiese Software gewährt Ihnen eine nicht-exklusive, nicht-übertragbare Lizenz zur Verwendung dieser Software gemäß der Dokumentation.\r\n\r\n2. Nutzungsbeschränkungen\r\nSie dürfen diese Software nicht dekompilieren, disassemblieren oder anderweitig zurückentwickeln; Sie dürfen diese Software nicht für illegale Zwecke verwenden.\r\n\r\n3. Geistiges Eigentum\r\nAlle geistigen Eigentumsrechte an dieser Software und ihren Kopien gehören dem Entwickler. Diese Lizenz gewährt Ihnen nicht das Recht, die mit dieser Software verbundenen Marken oder Logos zu verwenden.\r\n\r\n4. Haftungsausschluss\r\nDiese Software wird "wie besehen" ohne jegliche Gewährleistung bereitgestellt. Der Entwickler haftet nicht für Verluste, die durch die Verwendung dieser Software entstehen.\r\nDiese Software verwendet eine SQLite3-Datenbank zum Speichern von Datensätzen, die Datenbank ist jedoch nicht verschlüsselt. Aufgezeichnete Inhalte können unrechtmäßig abgerufen und eingesehen werden. Bitte verwahren Sie die Dateien im Datenverzeichnis sicher (können unter Einstellungen - Daten eingesehen werden).\r\n\r\n5. Kündigung\r\nWenn Sie gegen einen Begriff dieser Lizenzvereinbarung verstoßen, wird die Lizenz automatisch gekündigt und Sie müssen die Verwendung sofort einstellen und alle Kopien dieser Software vernichten.\r\n\r\nDurch die Installation und Verwendung dieser Software akzeptieren Sie die obige Vereinbarung.
STR_PRIVACY_TITLE=Datenschutzerklärung
STR_PRIVACY_BODY=SmartClip Datenschutzerklärung\r\n\r\n1. Datenspeicherung\r\nIhr Zwischenablage-Verlauf wird nur auf Ihrem lokalen Computer gespeichert und nicht auf einen Server hochgeladen.\r\n\r\n2. Datenerfassung\r\nDiese Software erfasst keine persönlichen Informationen. Zwischenablage-Inhalte werden nur eingefügt oder geteilt, wenn Sie diese aktiv verwenden.\r\n\r\n3. Drittanbieter-Dienste\r\nDiese Software verwendet keine Drittanbieter-Analytics-Dienste oder Werbe-SDKs.\r\n\r\n4. Datensicherheit\r\nWir empfehlen, regelmäßig nicht mehr benötigte Zwischenablage-Verlaufseinträge zu bereinigen, um sensible Informationen zu schützen.\r\n\r\n5. Aktualisierungen der Datenschutzerklärung\r\nWir können diese Datenschutzerklärung von Zeit zu Zeit aktualisieren. Die aktualisierte Richtlinie wird in der Software angezeigt.\r\n\r\nDurch die Installation und Verwendung dieser Software akzeptieren Sie die obige Datenschutzerklärung.
