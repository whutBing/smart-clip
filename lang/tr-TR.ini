STR_EULA_TITLE=Son Kullanıcı Lisans Sözleşmesi
STR_EULA_BODY=SmartClip Son Kullanıcı Lisans Sözleşmesi\r\n\r\n1. Lisansın Verilmesi\r\nBu yazılım, belgelendirme uyarınca bu yazılımı kullanmanız için münhasır olmayan, devredilemez bir lisans sağlar.\r\n\r\n2. Kullanım Kısıtlamaları\r\nBu yazılımı derleyemez, parçalayamaz veya başka şekilde geri mühendislik yapamazsınız; bu yazılımı herhangi bir yasadışı amaçla kullanamazsınız.\r\n\r\n3. Fikri Mülkiyet\r\nBu yazılım ve kopyalarındaki tüm fikri mülkiyet hakları geliştiriciye aittir. Bu lisans, bu yazılımla ilişkili ticari markaları veya logoları kullanma hakkı vermez.\r\n\r\n4. Sorumluluk Reddi\r\nBu yazılım "olduğu gibi" herhangi bir garanti olmadan sağlanır. Geliştirici, bu yazılımın kullanımından kaynaklanan kayıplardan sorumlu değildir.\r\nBu yazılım kayıtları depolamak için SQLite3 veritabanı kullanır, ancak veritabanı şifreli değildir. Kaydedilen içerik yasadışı yollarla elde edilip görüntülenebilir. Lütfen veri dizini dosyalarını güvenli tutun (Ayarlar - Veri altında görüntülenebilir).\r\n\r\n5. Fesih\r\nBu lisans sözleşmesinin herhangi bir hükmünü ihlal ederseniz, lisans otomatik olarak sona erer ve bu yazılımı kullanmayı derhal durdurmalı ve tüm kopyalarını imha etmelisiniz.\r\n\r\nBu yazılımı yükleyip kullanmanız, yukarıdaki sözleşmeyi kabul ettiğiniz anlamına gelir.
STR_PRIVACY_TITLE=Gizlilik Politikası
STR_PRIVACY_BODY=SmartClip Gizlilik Politikası\r\n\r\n1. Veri Depolama\r\nPano geçmişiniz yalnızca yerel bilgisayarınızda saklanır ve hiçbir sunucuya yüklenmez.\r\n\r\n2. Veri Toplama\r\nBu yazılım kişisel bilgilerinizi toplamaz. Pano içeriği yalnızca aktif olarak kullandığınızda yapıştırılır veya paylaşılır.\r\n\r\n3. Üçüncü Taraf Hizmetleri\r\nBu yazılım herhangi bir üçüncü taraf analiz hizmeti veya reklam SDK'sı kullanmaz.\r\n\r\n4. Veri Güvenliği\r\nHassas bilgileri korumak için artık ihtiyaç duymadığınız pano geçmişini düzenli olarak temizlemenizi öneririz.\r\n\r\n5. Gizlilik Politikası Güncellemeleri\r\nBu gizlilik politikasını zaman zaman güncelleyebiliriz. Güncellenmiş politika yazılımda görüntülenecektir.\r\n\r\nBu yazılımı yükleyip kullanmanız, yukarıdaki gizlilik politikasını kabul ettiğiniz anlamına gelir.
