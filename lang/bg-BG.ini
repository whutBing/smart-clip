STR_AGREEMENT_DIALOG_BODY=Този софтуер е предназначен само за законни цели. Потребителите трябва да пазят правилно данните си в клипборда.\r\nСъдържанието на клипборда може да съдържа чувствителна информация. Повреди на системата, случайни операции или неочаквани проблеми могат да доведат до загуба на данни. Авторът не носи отговорност за произтичащите щети.\r\nЩракването върху „Приемам“ означава, че сте прочели и приели горепосочените условия.
